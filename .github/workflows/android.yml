name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lint assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Signed App Bundle
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The keystore is kept as a base64 secret and only ever written to the runner temp folder.
      - name: Restore the signing keystore
        env:
          VCC_KEYSTORE_BASE64: ${{ secrets.VCC_KEYSTORE_BASE64 }}
        run: printf '%s' "$VCC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vcc-release.jks"
      - name: Build the App Bundle
        env:
          VCC_KEYSTORE: ${{ runner.temp }}/vcc-release.jks
          VCC_KEYSTORE_PASSWORD: ${{ secrets.VCC_KEYSTORE_PASSWORD }}
          VCC_KEY_ALIAS: ${{ secrets.VCC_KEY_ALIAS }}
          VCC_KEY_PASSWORD: ${{ secrets.VCC_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Discard the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vcc-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
